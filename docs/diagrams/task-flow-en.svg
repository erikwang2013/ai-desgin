<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1260" viewBox="0 0 880 1260" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>

  <rect width="880" height="1150" fill="#ffffff"/>

  <text x="440" y="42" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">AI Design Task Flow</text>
  <text x="440" y="72" font-size="15" fill="#6b7280" text-anchor="middle">End-to-end pipeline from natural language to design-software execution</text>

  <!-- ① User input -->
  <rect x="230" y="100" width="420" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="128" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① User Input</text>
  <text x="440" y="150" font-size="13" fill="#1e40af" text-anchor="middle">Describe the design task in natural language — no scripting needed</text>
  <line x1="440" y1="164" x2="440" y2="198" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="183" font-size="12" fill="#374151">Parse task</text>

  <!-- ② TaskOrchestrator -->
  <rect x="230" y="200" width="420" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="228" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">② TaskOrchestrator</text>
  <text x="440" y="250" font-size="13" fill="#047857" text-anchor="middle">Queue task · track status (pending → running)</text>
  <line x1="440" y1="264" x2="440" y2="298" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="283" font-size="12" fill="#374151">Create session</text>

  <!-- ③ CCProcessManager -->
  <rect x="230" y="300" width="420" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="328" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">③ CCProcessManager</text>
  <text x="440" y="350" font-size="13" fill="#047857" text-anchor="middle">Agent process session mgmt · up to 3 parallel processes</text>
  <line x1="440" y1="364" x2="440" y2="398" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="383" font-size="12" fill="#374151">Invoke CLI</text>

  <!-- ④ Agent Backend -->
  <rect x="230" y="400" width="420" height="64" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="440" y="428" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">④ Agent Backend Analysis</text>
  <text x="440" y="450" font-size="13" fill="#6d28d9" text-anchor="middle">Understand intent · pick best model · plan the steps</text>
  <line x1="440" y1="464" x2="440" y2="498" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="483" font-size="12" fill="#374151">Route decision</text>

  <!-- ⑤ ModelRouter -->
  <rect x="230" y="500" width="420" height="64" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="440" y="528" font-size="16" font-weight="bold" fill="#155e75" text-anchor="middle">⑤ ModelRouter</text>
  <text x="440" y="550" font-size="12.5" fill="#0e7490" text-anchor="middle">Opus → UI/visual · Sonnet → logic/code · Haiku → simple ops</text>
  <line x1="440" y1="564" x2="440" y2="598" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="583" font-size="12" fill="#374151">Generate script</text>

  <!-- ⑥ PluginManager -->
  <rect x="230" y="600" width="420" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="628" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">⑥ PluginManager Script Generation</text>
  <text x="440" y="650" font-size="13" fill="#b45309" text-anchor="middle">Generate a control script for the target app (Figma JS / Python…)</text>
  <line x1="440" y1="664" x2="440" y2="698" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="683" font-size="12" fill="#374151">Dispatch</text>

  <!-- ⑦ Execution dispatch -->
  <rect x="230" y="700" width="420" height="64" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="440" y="728" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="middle">⑦ Execution Dispatch</text>
  <text x="440" y="750" font-size="13" fill="#c2410c" text-anchor="middle">Pick an execution path by software capability (honest fallback)</text>

  <!-- Branch boxes -->
  <line x1="440" y1="764" x2="440" y2="790" stroke="#6b7280" stroke-width="2"/>
  <line x1="255" y1="790" x2="625" y2="790" stroke="#6b7280" stroke-width="2"/>
  <line x1="255" y1="790" x2="255" y2="816" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="625" y1="790" x2="625" y2="816" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="90" y="818" width="330" height="76" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="255" y="846" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">LocalScriptExecutor CLI Auto-run</text>
  <text x="255" y="870" font-size="12.5" fill="#047857" text-anchor="middle">17 apps (Blender · AutoCAD · slicers…)</text>

  <rect x="460" y="818" width="330" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="625" y="846" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">Manual Execution Copy</text>
  <text x="625" y="870" font-size="12.5" fill="#b45309" text-anchor="middle">Script + copy hint (45 apps)</text>

  <!-- Merge into design software -->
  <line x1="255" y1="894" x2="255" y2="920" stroke="#6b7280" stroke-width="2"/>
  <line x1="625" y1="894" x2="625" y2="920" stroke="#6b7280" stroke-width="2"/>
  <line x1="255" y1="920" x2="625" y2="920" stroke="#6b7280" stroke-width="2"/>
  <line x1="440" y1="920" x2="440" y2="946" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="939" font-size="12" fill="#374151">Run script</text>

  <!-- ⑧ Design software executes -->
  <rect x="230" y="948" width="420" height="64" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="440" y="976" font-size="16" font-weight="bold" fill="#9d174d" text-anchor="middle">⑧ Design Software Executes</text>
  <text x="440" y="998" font-size="13" fill="#be185d" text-anchor="middle">Script drives canvas, layers, modeling, slicing and more</text>
  <line x1="440" y1="1012" x2="440" y2="1046" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="1031" font-size="12" fill="#374151">Output &amp; artifacts</text>

  <!-- ⑨ Verification loop -->
  <rect x="230" y="1048" width="420" height="64" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="440" y="1076" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">⑨ Verify &amp; Iterate</text>
  <text x="440" y="1098" font-size="13" fill="#dc2626" text-anchor="middle">ArtifactVerifier: artifacts present · up to 3 rounds</text>
  <line x1="210" y1="1080" x2="210" y2="640" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="186" y="860" font-size="11" fill="#b91c1c" text-anchor="middle" transform="rotate(-90 186 860)">Failed → feedback · regenerate (≤3 rounds)</text>
  <line x1="440" y1="1112" x2="440" y2="1146" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="1131" font-size="12" fill="#374151">Verified ✓</text>

  <!-- ⑩ Result -->
  <rect x="230" y="1148" width="420" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="1176" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">⑩ Result Returned · User Confirms</text>
  <text x="440" y="1198" font-size="13" fill="#047857" text-anchor="middle">Screenshot / log back in chat · task marked completed</text>
</svg>
