<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .chip { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>

  <text x="720" y="42" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">AI Design Feature Map</text>
  <text x="720" y="72" font-size="15" fill="#6b7280" text-anchor="middle">Six design domains · 14 feature categories · 62 supported apps</text>

  <!-- Core engine -->
  <rect x="560" y="110" width="320" height="80" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  <text x="720" y="142" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">AI Design Core Engine</text>
  <text x="720" y="168" font-size="13" fill="#475569" text-anchor="middle">Model routing · Script generation · Task orchestration</text>

  <!-- Core → domains fan arrows -->
  <g stroke="#6b7280" stroke-width="2" fill="none">
    <line x1="720" y1="190" x2="162" y2="258" marker-end="url(#arrow)"/>
    <line x1="720" y1="190" x2="385" y2="258" marker-end="url(#arrow)"/>
    <line x1="720" y1="190" x2="608" y2="258" marker-end="url(#arrow)"/>
    <line x1="720" y1="190" x2="831" y2="258" marker-end="url(#arrow)"/>
    <line x1="720" y1="190" x2="1054" y2="258" marker-end="url(#arrow)"/>
    <line x1="720" y1="190" x2="1277" y2="258" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ Six design domains ============ -->
  <!-- 1 Web Design -->
  <rect x="60" y="260" width="205" height="130" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="60" y="260" width="205" height="34" rx="10" fill="#3b82f6"/>
  <rect x="60" y="285" width="205" height="9" fill="#3b82f6"/>
  <text x="162" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Web Design</text>
  <g font-size="12.5" fill="#1e3a8a" text-anchor="middle">
    <text x="162" y="322">Figma · Sketch · Adobe XD</text>
    <text x="162" y="346">Dreamweaver · Express</text>
  </g>

  <!-- 2 Advertising -->
  <rect x="283" y="260" width="205" height="130" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <rect x="283" y="260" width="205" height="34" rx="10" fill="#ec4899"/>
  <rect x="283" y="285" width="205" height="9" fill="#ec4899"/>
  <text x="385" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Advertising</text>
  <g font-size="12.5" fill="#9d174d" text-anchor="middle">
    <text x="385" y="322">Photoshop · Illustrator</text>
    <text x="385" y="346">After Effects · Premiere</text>
    <text x="385" y="370">Lightroom · Audition +14 apps</text>
  </g>

  <!-- 3 Industrial -->
  <rect x="506" y="260" width="205" height="130" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <rect x="506" y="260" width="205" height="34" rx="10" fill="#f59e0b"/>
  <rect x="506" y="285" width="205" height="9" fill="#f59e0b"/>
  <text x="608" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Industrial</text>
  <g font-size="12.5" fill="#92400e" text-anchor="middle">
    <text x="608" y="322">Fusion 360 · SolidWorks</text>
    <text x="608" y="346">FreeCAD · Rhino · ZW3D</text>
    <text x="608" y="370">Tinkercad · Slicers</text>
  </g>

  <!-- 4 3D Design -->
  <rect x="729" y="260" width="205" height="130" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="729" y="260" width="205" height="34" rx="10" fill="#8b5cf6"/>
  <rect x="729" y="285" width="205" height="9" fill="#8b5cf6"/>
  <text x="831" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3D Design</text>
  <g font-size="12.5" fill="#5b21b6" text-anchor="middle">
    <text x="831" y="322">Blender · Maya · 3ds Max</text>
    <text x="831" y="346">Cinema 4D · SketchUp</text>
    <text x="831" y="370">Substance 3D · Meshy</text>
  </g>

  <!-- 5 Architecture -->
  <rect x="952" y="260" width="205" height="130" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="952" y="260" width="205" height="34" rx="10" fill="#10b981"/>
  <rect x="952" y="285" width="205" height="9" fill="#10b981"/>
  <text x="1054" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Architecture</text>
  <g font-size="12.5" fill="#065f46" text-anchor="middle">
    <text x="1054" y="322">AutoCAD · Revit</text>
    <text x="1054" y="346">AutoLISP / Dynamo scripts</text>
  </g>

  <!-- 6 Interior -->
  <rect x="1175" y="260" width="205" height="130" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <rect x="1175" y="260" width="205" height="34" rx="10" fill="#06b6d4"/>
  <rect x="1175" y="285" width="205" height="9" fill="#06b6d4"/>
  <text x="1277" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Interior</text>
  <g font-size="12.5" fill="#155e75" text-anchor="middle">
    <text x="1277" y="322">SketchUp · Kujiale</text>
    <text x="1277" y="346">3Vjia · Yuanfang</text>
  </g>

  <!-- ============ 14 feature categories ============ -->
  <line x1="720" y1="390" x2="720" y2="424" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="720" y="448" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">14 Feature Categories</text>

  <!-- Group 1 Creative Design -->
  <rect x="60" y="470" width="310" height="220" rx="12" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
  <rect x="60" y="470" width="310" height="38" rx="12" fill="#3b82f6"/>
  <rect x="60" y="495" width="310" height="13" fill="#3b82f6"/>
  <text x="215" y="494" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Creative Design (19 apps)</text>
  <g font-size="13.5" fill="#111827" text-anchor="middle">
    <rect class="chip" x="80" y="522" width="270" height="34" rx="8"/><text x="215" y="544">Graphic &amp; UI Design (8)</text>
    <rect class="chip" x="80" y="564" width="270" height="34" rx="8"/><text x="215" y="586">Motion Graphics &amp; Video (5)</text>
    <rect class="chip" x="80" y="606" width="270" height="34" rx="8"/><text x="215" y="628">Photography &amp; Digital Art (4)</text>
    <rect class="chip" x="80" y="648" width="270" height="34" rx="8"/><text x="215" y="670">Collaboration &amp; Audio (2)</text>
  </g>

  <!-- Group 2 3D Modeling -->
  <rect x="386" y="470" width="310" height="220" rx="12" fill="#f8fafc" stroke="#10b981" stroke-width="2"/>
  <rect x="386" y="470" width="310" height="38" rx="12" fill="#10b981"/>
  <rect x="386" y="495" width="310" height="13" fill="#10b981"/>
  <text x="541" y="494" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3D Modeling (25 apps)</text>
  <g font-size="13.5" fill="#111827" text-anchor="middle">
    <rect class="chip" x="406" y="522" width="270" height="34" rx="8"/><text x="541" y="544">3D Modeling &amp; Animation (13)</text>
    <rect class="chip" x="406" y="564" width="270" height="34" rx="8"/><text x="541" y="586">CAD &amp; BIM Modeling (6)</text>
    <rect class="chip" x="406" y="606" width="270" height="34" rx="8"/><text x="541" y="628">Industrial Design &amp; CAM (3)</text>
    <rect class="chip" x="406" y="648" width="270" height="34" rx="8"/><text x="541" y="670">Educational / CN 3D (3)</text>
  </g>

  <!-- Group 3 3D Printing -->
  <rect x="712" y="470" width="310" height="220" rx="12" fill="#f8fafc" stroke="#f97316" stroke-width="2"/>
  <rect x="712" y="470" width="310" height="38" rx="12" fill="#f97316"/>
  <rect x="712" y="495" width="310" height="13" fill="#f97316"/>
  <text x="867" y="494" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3D Printing (15 apps)</text>
  <g font-size="13.5" fill="#111827" text-anchor="middle">
    <rect class="chip" x="732" y="522" width="270" height="34" rx="8"/><text x="867" y="544">FDM Slicers (4)</text>
    <rect class="chip" x="732" y="564" width="270" height="34" rx="8"/><text x="867" y="586">Resin Slicers (2)</text>
    <rect class="chip" x="732" y="606" width="270" height="34" rx="8"/><text x="867" y="628">Print Tools &amp; Management (7)</text>
    <rect class="chip" x="732" y="648" width="270" height="34" rx="8"/><text x="867" y="670">Specialty Printing (2)</text>
  </g>

  <!-- Group 4 Spatial & AI Generation -->
  <rect x="1038" y="470" width="310" height="220" rx="12" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="1038" y="470" width="310" height="38" rx="12" fill="#8b5cf6"/>
  <rect x="1038" y="495" width="310" height="13" fill="#8b5cf6"/>
  <text x="1193" y="494" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Spatial &amp; AI Generation (3 + AI)</text>
  <g font-size="13.5" fill="#111827" text-anchor="middle">
    <rect class="chip" x="1058" y="522" width="270" height="34" rx="8"/><text x="1193" y="544">Interior Design (3)</text>
    <rect class="chip" x="1058" y="564" width="270" height="76" rx="8" fill="#fef2f2" stroke="#ef4444"/><text x="1193" y="590" font-weight="bold" fill="#b91c1c">AI Model Generation (Meshy)</text><text x="1193" y="614" font-size="12.5" fill="#7f1d1d">Text / image → 3D model</text>
  </g>

  <!-- ============ Bottom stat badges ============ -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="360" y="770" width="220" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="470" y="812" font-size="30" font-weight="bold" fill="#1d4ed8" text-anchor="middle">62</text>
    <text x="470" y="842" font-size="14" fill="#1e40af" text-anchor="middle">Supported apps</text>

    <rect x="610" y="770" width="220" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="720" y="812" font-size="30" font-weight="bold" fill="#059669" text-anchor="middle">6</text>
    <text x="720" y="842" font-size="14" fill="#065f46" text-anchor="middle">Design domains</text>

    <rect x="860" y="770" width="220" height="90" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="970" y="812" font-size="30" font-weight="bold" fill="#7c3aed" text-anchor="middle">14</text>
    <text x="970" y="842" font-size="14" fill="#5b21b6" text-anchor="middle">Feature categories</text>
  </g>
</svg>
