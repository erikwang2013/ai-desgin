<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .chip { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1280" height="820" fill="#ffffff"/>

  <text x="640" y="42" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">AI Design 生命周期图</text>
  <text x="640" y="72" font-size="15" fill="#6b7280" text-anchor="middle">任务 · 插件 · 会话 三大生命周期一览</text>

  <!-- ============ Lane 1 任务生命周期 ============ -->
  <rect x="30" y="100" width="1220" height="210" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="30" y="100" width="1220" height="38" rx="12" fill="#3b82f6"/>
  <rect x="30" y="125" width="1220" height="13" fill="#3b82f6"/>
  <text x="640" y="126" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">① 任务生命周期（Task Lifecycle）</text>

  <!-- 主流程 Pending → Running → Completed -->
  <rect x="230" y="150" width="170" height="72" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="315" y="182" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Pending 等待中</text>
  <text x="315" y="204" font-size="12" fill="#1e40af" text-anchor="middle">已入队，等待执行</text>

  <line x1="402" y1="186" x2="422" y2="186" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="428" y="150" width="170" height="72" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="513" y="182" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Running 进行中</text>
  <text x="513" y="204" font-size="12" fill="#1e40af" text-anchor="middle">Agent 后端执行任务</text>

  <line x1="600" y1="186" x2="620" y2="186" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="628" y="150" width="170" height="72" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="713" y="182" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">Completed 已完成 ✓</text>
  <text x="713" y="204" font-size="12" fill="#065f46" text-anchor="middle">成功结束，结果已回传</text>

  <!-- 终止分支 -->
  <line x1="315" y1="222" x2="315" y2="232" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="230" y="236" width="170" height="54" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-width="2"/>
  <text x="315" y="260" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">Cancelled 已取消</text>
  <text x="315" y="280" font-size="11.5" fill="#6b7280" text-anchor="middle">用户主动取消</text>

  <line x1="513" y1="222" x2="513" y2="232" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="236" width="170" height="54" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="515" y="260" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">Failed 失败 ✗</text>
  <text x="515" y="280" font-size="11.5" fill="#7f1d1d" text-anchor="middle">执行出错，任务终止</text>

  <text x="870" y="258" font-size="13" fill="#1e40af" text-anchor="middle">取消：等待中或进行中均可取消</text>
  <text x="870" y="280" font-size="13" fill="#1e40af" text-anchor="middle">终态：Completed / Failed / Cancelled</text>

  <!-- ============ Lane 2 插件生命周期 ============ -->
  <rect x="30" y="340" width="1220" height="210" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <rect x="30" y="340" width="1220" height="38" rx="12" fill="#f59e0b"/>
  <rect x="30" y="365" width="1220" height="13" fill="#f59e0b"/>
  <text x="640" y="366" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">② 插件生命周期（Plugin Lifecycle）</text>

  <rect x="230" y="390" width="160" height="76" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="310" y="422" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">Register 注册</text>
  <text x="310" y="446" font-size="12" fill="#92400e" text-anchor="middle">PluginManager.register</text>

  <line x1="392" y1="428" x2="410" y2="428" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="414" y="390" width="160" height="76" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="494" y="422" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">Available 可用</text>
  <text x="494" y="446" font-size="12" fill="#92400e" text-anchor="middle">已加载，等待调用</text>

  <line x1="576" y1="428" x2="594" y2="428" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="598" y="390" width="160" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="678" y="422" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">Execute 执行</text>
  <text x="678" y="446" font-size="12" fill="#92400e" text-anchor="middle">生成脚本并执行</text>

  <line x1="760" y1="428" x2="778" y2="428" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="782" y="390" width="160" height="76" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="862" y="422" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">Dispose 销毁</text>
  <text x="862" y="446" font-size="12" fill="#92400e" text-anchor="middle">释放资源，移除注册</text>

  <text x="640" y="510" font-size="13" fill="#92400e" text-anchor="middle">插件市场安装 → 自动注册</text>
  <text x="640" y="534" font-size="13" fill="#92400e" text-anchor="middle">应用退出时统一清理（disposeAll）</text>

  <!-- ============ Lane 3 会话生命周期 ============ -->
  <rect x="30" y="580" width="1220" height="210" rx="12" fill="#ecfeff" stroke="#0d9488" stroke-width="2"/>
  <rect x="30" y="580" width="1220" height="38" rx="12" fill="#0d9488"/>
  <rect x="30" y="605" width="1220" height="13" fill="#0d9488"/>
  <text x="640" y="606" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">③ 会话生命周期（Session Lifecycle）</text>

  <rect x="230" y="630" width="130" height="76" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="295" y="662" font-size="14.5" font-weight="bold" fill="#0f766e" text-anchor="middle">Create 创建</text>
  <text x="295" y="686" font-size="11.5" fill="#115e59" text-anchor="middle">新建会话</text>

  <line x1="362" y1="668" x2="376" y2="668" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="630" width="130" height="76" rx="10" fill="#ecfeff" stroke="#0d9488" stroke-width="2"/>
  <text x="445" y="662" font-size="14.5" font-weight="bold" fill="#0f766e" text-anchor="middle">Active 活跃</text>
  <text x="445" y="686" font-size="11.5" fill="#115e59" text-anchor="middle">最多 3 个并行</text>

  <line x1="512" y1="668" x2="526" y2="668" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="530" y="630" width="130" height="76" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="595" y="662" font-size="14.5" font-weight="bold" fill="#0f766e" text-anchor="middle">Idle 空闲</text>
  <text x="595" y="686" font-size="11.5" fill="#115e59" text-anchor="middle">无任务等待</text>

  <line x1="662" y1="668" x2="676" y2="668" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="680" y="630" width="130" height="76" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="745" y="662" font-size="14.5" font-weight="bold" fill="#0f766e" text-anchor="middle">Evict 回收</text>
  <text x="745" y="686" font-size="11.5" fill="#115e59" text-anchor="middle">超时 300 秒</text>

  <line x1="812" y1="668" x2="826" y2="668" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="830" y="630" width="130" height="76" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="895" y="662" font-size="14.5" font-weight="bold" fill="#0f766e" text-anchor="middle">Close 关闭</text>
  <text x="895" y="686" font-size="11.5" fill="#115e59" text-anchor="middle">会话彻底结束</text>

  <text x="640" y="740" font-size="13" fill="#115e59" text-anchor="middle">CCProcessManager 统一管理（最多 3 个进程并行）</text>
  <text x="640" y="764" font-size="13" fill="#115e59" text-anchor="middle">每 60 秒巡检回收空闲会话 · 回收时终止关联任务进程</text>
</svg>
