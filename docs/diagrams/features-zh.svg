<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .chip { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>

  <text x="720" y="42" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">AI Design 功能全景图</text>
  <text x="720" y="72" font-size="15" fill="#6b7280" text-anchor="middle">六大设计领域 · 14 大功能类别 · 62 款已支持软件</text>

  <!-- 核心引擎 -->
  <rect x="560" y="110" width="320" height="80" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  <text x="720" y="142" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">AI Design 核心引擎</text>
  <text x="720" y="168" font-size="13" fill="#475569" text-anchor="middle">模型路由 · 脚本生成 · 任务编排</text>

  <!-- 核心 → 六大领域 扇形箭头 -->
  <g stroke="#6b7280" stroke-width="2" fill="none">
    <line x1="720" y1="190" x2="162" y2="258" marker-end="url(#arrow)"/>
    <line x1="720" y1="190" x2="385" y2="258" marker-end="url(#arrow)"/>
    <line x1="720" y1="190" x2="608" y2="258" marker-end="url(#arrow)"/>
    <line x1="720" y1="190" x2="831" y2="258" marker-end="url(#arrow)"/>
    <line x1="720" y1="190" x2="1054" y2="258" marker-end="url(#arrow)"/>
    <line x1="720" y1="190" x2="1277" y2="258" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ 六大设计领域 ============ -->
  <!-- 1 Web 设计 -->
  <rect x="60" y="260" width="205" height="130" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="60" y="260" width="205" height="34" rx="10" fill="#3b82f6"/>
  <rect x="60" y="285" width="205" height="9" fill="#3b82f6"/>
  <text x="162" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Web 设计</text>
  <g font-size="12.5" fill="#1e3a8a" text-anchor="middle">
    <text x="162" y="322">Figma · Sketch · Adobe XD</text>
    <text x="162" y="346">Dreamweaver · Express</text>
  </g>

  <!-- 2 广告设计 -->
  <rect x="283" y="260" width="205" height="130" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <rect x="283" y="260" width="205" height="34" rx="10" fill="#ec4899"/>
  <rect x="283" y="285" width="205" height="9" fill="#ec4899"/>
  <text x="385" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">广告设计</text>
  <g font-size="12.5" fill="#9d174d" text-anchor="middle">
    <text x="385" y="322">Photoshop · Illustrator</text>
    <text x="385" y="346">After Effects · Premiere</text>
    <text x="385" y="370">Lightroom · Audition 等 14 款</text>
  </g>

  <!-- 3 工业设计 -->
  <rect x="506" y="260" width="205" height="130" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <rect x="506" y="260" width="205" height="34" rx="10" fill="#f59e0b"/>
  <rect x="506" y="285" width="205" height="9" fill="#f59e0b"/>
  <text x="608" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">工业设计</text>
  <g font-size="12.5" fill="#92400e" text-anchor="middle">
    <text x="608" y="322">Fusion 360 · SolidWorks</text>
    <text x="608" y="346">FreeCAD · Rhino · 中望3D</text>
    <text x="608" y="370">Tinkercad · 切片器系列</text>
  </g>

  <!-- 4 3D 设计 -->
  <rect x="729" y="260" width="205" height="130" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="729" y="260" width="205" height="34" rx="10" fill="#8b5cf6"/>
  <rect x="729" y="285" width="205" height="9" fill="#8b5cf6"/>
  <text x="831" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3D 设计</text>
  <g font-size="12.5" fill="#5b21b6" text-anchor="middle">
    <text x="831" y="322">Blender · Maya · 3ds Max</text>
    <text x="831" y="346">Cinema 4D · SketchUp</text>
    <text x="831" y="370">Substance 3D · Meshy</text>
  </g>

  <!-- 5 建筑设计 -->
  <rect x="952" y="260" width="205" height="130" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="952" y="260" width="205" height="34" rx="10" fill="#10b981"/>
  <rect x="952" y="285" width="205" height="9" fill="#10b981"/>
  <text x="1054" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">建筑设计</text>
  <g font-size="12.5" fill="#065f46" text-anchor="middle">
    <text x="1054" y="322">AutoCAD · Revit</text>
    <text x="1054" y="346">AutoLISP / Dynamo 脚本</text>
  </g>

  <!-- 6 装修设计 -->
  <rect x="1175" y="260" width="205" height="130" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <rect x="1175" y="260" width="205" height="34" rx="10" fill="#06b6d4"/>
  <rect x="1175" y="285" width="205" height="9" fill="#06b6d4"/>
  <text x="1277" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">装修设计</text>
  <g font-size="12.5" fill="#155e75" text-anchor="middle">
    <text x="1277" y="322">SketchUp · 酷家乐</text>
    <text x="1277" y="346">三维家 · 圆方</text>
  </g>

  <!-- ============ 14 大功能类别 ============ -->
  <line x1="720" y1="390" x2="720" y2="424" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="720" y="448" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">14 大功能类别</text>

  <!-- 组 1 设计创作 -->
  <rect x="60" y="470" width="310" height="220" rx="12" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
  <rect x="60" y="470" width="310" height="38" rx="12" fill="#3b82f6"/>
  <rect x="60" y="495" width="310" height="13" fill="#3b82f6"/>
  <text x="215" y="494" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">设计创作（19 款）</text>
  <g font-size="13.5" fill="#111827" text-anchor="middle">
    <rect class="chip" x="80" y="522" width="270" height="34" rx="8"/><text x="215" y="544">平面与 UI 设计（8 款）</text>
    <rect class="chip" x="80" y="564" width="270" height="34" rx="8"/><text x="215" y="586">动态图形与视频（5 款）</text>
    <rect class="chip" x="80" y="606" width="270" height="34" rx="8"/><text x="215" y="628">摄影与数字绘画（4 款）</text>
    <rect class="chip" x="80" y="648" width="270" height="34" rx="8"/><text x="215" y="670">协同与音频（2 款）</text>
  </g>

  <!-- 组 2 三维建模 -->
  <rect x="386" y="470" width="310" height="220" rx="12" fill="#f8fafc" stroke="#10b981" stroke-width="2"/>
  <rect x="386" y="470" width="310" height="38" rx="12" fill="#10b981"/>
  <rect x="386" y="495" width="310" height="13" fill="#10b981"/>
  <text x="541" y="494" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">三维建模（25 款）</text>
  <g font-size="13.5" fill="#111827" text-anchor="middle">
    <rect class="chip" x="406" y="522" width="270" height="34" rx="8"/><text x="541" y="544">3D 建模与动画（13 款）</text>
    <rect class="chip" x="406" y="564" width="270" height="34" rx="8"/><text x="541" y="586">CAD 与 BIM 建模（6 款）</text>
    <rect class="chip" x="406" y="606" width="270" height="34" rx="8"/><text x="541" y="628">工业设计与 CAM（3 款）</text>
    <rect class="chip" x="406" y="648" width="270" height="34" rx="8"/><text x="541" y="670">教育 / 国产 3D（3 款）</text>
  </g>

  <!-- 组 3 3D 打印 -->
  <rect x="712" y="470" width="310" height="220" rx="12" fill="#f8fafc" stroke="#f97316" stroke-width="2"/>
  <rect x="712" y="470" width="310" height="38" rx="12" fill="#f97316"/>
  <rect x="712" y="495" width="310" height="13" fill="#f97316"/>
  <text x="867" y="494" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3D 打印（15 款）</text>
  <g font-size="13.5" fill="#111827" text-anchor="middle">
    <rect class="chip" x="732" y="522" width="270" height="34" rx="8"/><text x="867" y="544">FDM 切片器（4 款）</text>
    <rect class="chip" x="732" y="564" width="270" height="34" rx="8"/><text x="867" y="586">树脂切片器（2 款）</text>
    <rect class="chip" x="732" y="606" width="270" height="34" rx="8"/><text x="867" y="628">打印配套与管理（7 款）</text>
    <rect class="chip" x="732" y="648" width="270" height="34" rx="8"/><text x="867" y="670">专业打印（2 款）</text>
  </g>

  <!-- 组 4 空间与 AI 生成 -->
  <rect x="1038" y="470" width="310" height="220" rx="12" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="1038" y="470" width="310" height="38" rx="12" fill="#8b5cf6"/>
  <rect x="1038" y="495" width="310" height="13" fill="#8b5cf6"/>
  <text x="1193" y="494" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">空间与 AI 生成（3 款 + AI）</text>
  <g font-size="13.5" fill="#111827" text-anchor="middle">
    <rect class="chip" x="1058" y="522" width="270" height="34" rx="8"/><text x="1193" y="544">装修设计（3 款）</text>
    <rect class="chip" x="1058" y="564" width="270" height="76" rx="8" fill="#fef2f2" stroke="#ef4444"/><text x="1193" y="590" font-weight="bold" fill="#b91c1c">AI 模型生成（Meshy）</text><text x="1193" y="614" font-size="12.5" fill="#7f1d1d">文字 / 图片 → 3D 模型</text>
  </g>

  <!-- ============ 底部统计徽章 ============ -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">
    <rect x="360" y="770" width="220" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="470" y="812" font-size="30" font-weight="bold" fill="#1d4ed8" text-anchor="middle">62</text>
    <text x="470" y="842" font-size="14" fill="#1e40af" text-anchor="middle">款已支持软件</text>

    <rect x="610" y="770" width="220" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="720" y="812" font-size="30" font-weight="bold" fill="#059669" text-anchor="middle">6</text>
    <text x="720" y="842" font-size="14" fill="#065f46" text-anchor="middle">大设计领域</text>

    <rect x="860" y="770" width="220" height="90" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="970" y="812" font-size="30" font-weight="bold" fill="#7c3aed" text-anchor="middle">14</text>
    <text x="970" y="842" font-size="14" fill="#5b21b6" text-anchor="middle">大功能类别</text>
  </g>
</svg>
