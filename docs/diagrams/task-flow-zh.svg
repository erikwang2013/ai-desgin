<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1150" viewBox="0 0 880 1150" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>

  <rect width="880" height="1150" fill="#ffffff"/>

  <text x="440" y="42" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">AI Design 任务流程图</text>
  <text x="440" y="72" font-size="15" fill="#6b7280" text-anchor="middle">一次任务从自然语言到设计软件执行的完整链路</text>

  <!-- ① 用户输入 -->
  <rect x="230" y="100" width="420" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="128" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① 用户输入</text>
  <text x="440" y="150" font-size="13" fill="#1e40af" text-anchor="middle">自然语言描述设计需求，无需学习脚本语言</text>
  <line x1="440" y1="164" x2="440" y2="198" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="183" font-size="12" fill="#374151">解析任务</text>

  <!-- ② TaskOrchestrator -->
  <rect x="230" y="200" width="420" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="228" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">② TaskOrchestrator 任务编排</text>
  <text x="440" y="250" font-size="13" fill="#047857" text-anchor="middle">任务入队 · 状态跟踪（等待中 → 进行中）</text>
  <line x1="440" y1="264" x2="440" y2="298" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="283" font-size="12" fill="#374151">创建会话</text>

  <!-- ③ CCProcessManager -->
  <rect x="230" y="300" width="420" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="328" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">③ CCProcessManager 会话管理</text>
  <text x="440" y="350" font-size="13" fill="#047857" text-anchor="middle">Agent 进程会话管理 · 最多 3 个进程并行</text>
  <line x1="440" y1="364" x2="440" y2="398" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="383" font-size="12" fill="#374151">调用 CLI</text>

  <!-- ④ Agent Backend -->
  <rect x="230" y="400" width="420" height="64" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="440" y="428" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">④ Agent 后端智能分析</text>
  <text x="440" y="450" font-size="13" fill="#6d28d9" text-anchor="middle">理解需求 · 选择最优模型 · 规划操作步骤</text>
  <line x1="440" y1="464" x2="440" y2="498" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="483" font-size="12" fill="#374151">路由决策</text>

  <!-- ⑤ ModelRouter -->
  <rect x="230" y="500" width="420" height="64" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="440" y="528" font-size="16" font-weight="bold" fill="#155e75" text-anchor="middle">⑤ ModelRouter 模型路由</text>
  <text x="440" y="550" font-size="12.5" fill="#0e7490" text-anchor="middle">Opus → UI/视觉设计 · Sonnet → 逻辑/代码 · Haiku → 简单操作</text>
  <line x1="440" y1="564" x2="440" y2="598" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="583" font-size="12" fill="#374151">生成脚本</text>

  <!-- ⑥ PluginManager 脚本生成 -->
  <rect x="230" y="600" width="420" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="628" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">⑥ PluginManager 脚本生成</text>
  <text x="440" y="650" font-size="13" fill="#b45309" text-anchor="middle">按目标软件生成控制脚本（Figma JS / Python 等）</text>
  <line x1="440" y1="664" x2="440" y2="698" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="683" font-size="12" fill="#374151">分发执行</text>

  <!-- ⑦ 执行层分发 -->
  <rect x="230" y="700" width="420" height="64" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="440" y="728" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="middle">⑦ 执行层分发</text>
  <text x="440" y="750" font-size="13" fill="#c2410c" text-anchor="middle">按软件能力选择执行方式（诚实回退，不伪造结果）</text>

  <!-- 三个分支盒子 -->
  <line x1="440" y1="764" x2="440" y2="790" stroke="#6b7280" stroke-width="2"/>
  <line x1="170" y1="790" x2="710" y2="790" stroke="#6b7280" stroke-width="2"/>
  <line x1="170" y1="790" x2="170" y2="816" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="790" x2="440" y2="816" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="790" x2="710" y2="816" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="818" width="240" height="76" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="170" y="846" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">LocalScriptExecutor 自动执行</text>
  <text x="170" y="870" font-size="12.5" fill="#047857" text-anchor="middle">Blender / FreeCAD / OpenSCAD</text>

  <rect x="310" y="818" width="260" height="76" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="440" y="846" font-size="15" font-weight="bold" fill="#5b21b6" text-anchor="middle">CLI 直接执行</text>
  <text x="440" y="870" font-size="12.5" fill="#6d28d9" text-anchor="middle">headless 插件（3 个）</text>

  <rect x="590" y="818" width="240" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="710" y="846" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">手动执行提示</text>
  <text x="710" y="870" font-size="12.5" fill="#b45309" text-anchor="middle">生成脚本供复制（59 款）</text>

  <!-- 汇聚到设计软件 -->
  <line x1="170" y1="894" x2="170" y2="920" stroke="#6b7280" stroke-width="2"/>
  <line x1="440" y1="894" x2="440" y2="920" stroke="#6b7280" stroke-width="2"/>
  <line x1="710" y1="894" x2="710" y2="920" stroke="#6b7280" stroke-width="2"/>
  <line x1="170" y1="920" x2="440" y2="920" stroke="#6b7280" stroke-width="2"/>
  <line x1="440" y1="920" x2="440" y2="946" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="939" font-size="12" fill="#374151">执行脚本</text>

  <!-- ⑧ 设计软件执行 -->
  <rect x="230" y="948" width="420" height="64" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="440" y="976" font-size="16" font-weight="bold" fill="#9d174d" text-anchor="middle">⑧ 设计软件执行</text>
  <text x="440" y="998" font-size="13" fill="#be185d" text-anchor="middle">脚本驱动软件完成画布、图层、建模、切片等操作</text>
  <line x1="440" y1="1012" x2="440" y2="1046" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="452" y="1031" font-size="12" fill="#374151">回传结果</text>

  <!-- ⑨ 结果返回 -->
  <rect x="230" y="1048" width="420" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="1076" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">⑨ 结果返回 · 用户确认</text>
  <text x="440" y="1098" font-size="13" fill="#047857" text-anchor="middle">截图 / 日志回传对话 · 任务标记完成</text>
</svg>
