<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .chip { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1280" height="880" fill="#ffffff"/>

  <text x="640" y="42" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">AI Design 安全架构图</text>
  <text x="640" y="72" font-size="15" fill="#6b7280" text-anchor="middle">本地优先 · 进程隔离 · 最小信任边界</text>

  <!-- ============ Band 1 信任边界 ============ -->
  <rect x="30" y="100" width="1220" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="30" y="100" width="1220" height="38" rx="12" fill="#3b82f6"/>
  <rect x="30" y="125" width="1220" height="13" fill="#3b82f6"/>
  <text x="640" y="126" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">信任边界（Trust Boundary）</text>

  <rect x="50" y="160" width="250" height="64" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="175" y="192" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">用户界面（Flutter）</text>
  <text x="175" y="212" font-size="11.5" fill="#1e40af" text-anchor="middle">输入任务 / 查看结果</text>

  <line x1="304" y1="192" x2="351" y2="192" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="328" y="180" font-size="12" fill="#374151" text-anchor="middle">授权输入</text>

  <rect x="355" y="160" width="250" height="64" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="480" y="192" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">应用核心（Dart）</text>
  <text x="480" y="212" font-size="11.5" fill="#1e40af" text-anchor="middle">任务编排 / 插件管理</text>

  <line x1="609" y1="192" x2="656" y2="192" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="632" y="180" font-size="12" fill="#374151" text-anchor="middle">进程隔离</text>

  <rect x="660" y="160" width="250" height="64" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="785" y="192" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Agent 后端进程</text>
  <text x="785" y="212" font-size="11.5" fill="#1e40af" text-anchor="middle">多模型调度 / 脚本生成</text>

  <line x1="914" y1="192" x2="961" y2="192" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="937" y="180" font-size="12" fill="#374151" text-anchor="middle">受控执行</text>

  <rect x="965" y="160" width="250" height="64" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="1090" y="192" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">设计软件进程</text>
  <text x="1090" y="212" font-size="11.5" fill="#1e40af" text-anchor="middle">Figma / Blender / …62 款</text>

  <!-- ============ Band 2 安全机制 ============ -->
  <rect x="30" y="270" width="1220" height="300" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="30" y="270" width="1220" height="38" rx="12" fill="#10b981"/>
  <rect x="30" y="295" width="1220" height="13" fill="#10b981"/>
  <text x="640" y="296" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">安全机制（Security Mechanisms）</text>

  <!-- 凭据保护 -->
  <rect x="60" y="330" width="6" height="110" fill="#3b82f6"/>
  <rect x="66" y="330" width="574" height="110" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="88" y="358" font-size="14.5" font-weight="bold" fill="#1d4ed8">凭据保护</text>
  <text x="88" y="388" font-size="12.5" fill="#374151">· API 密钥存 SharedPreferences（明文存储 — 已知限制）</text>
  <text x="88" y="412" font-size="12.5" fill="#374151">· 密钥不出现在日志 / 会话记录中</text>

  <!-- 进程隔离 -->
  <rect x="640" y="330" width="6" height="110" fill="#8b5cf6"/>
  <rect x="646" y="330" width="574" height="110" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="668" y="358" font-size="14.5" font-weight="bold" fill="#6d28d9">进程隔离</text>
  <text x="668" y="388" font-size="12.5" fill="#374151">· Rust IPC 进程隔离（spawn / send_script / kill）</text>
  <text x="668" y="412" font-size="12.5" fill="#374151">· cc_runner 120 秒超时强杀孤儿进程</text>

  <!-- 脚本执行控制 -->
  <rect x="60" y="460" width="6" height="110" fill="#f59e0b"/>
  <rect x="66" y="460" width="574" height="110" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="88" y="488" font-size="14.5" font-weight="bold" fill="#b45309">脚本执行控制</text>
  <text x="88" y="518" font-size="12.5" fill="#374151">· 脚本仅在用户指定的设计软件中运行</text>
  <text x="88" y="542" font-size="12.5" fill="#374151">· 无法自动执行时诚实回退，生成脚本供手动复制</text>

  <!-- 数据本地化 -->
  <rect x="640" y="460" width="6" height="110" fill="#0d9488"/>
  <rect x="646" y="460" width="574" height="110" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="668" y="488" font-size="14.5" font-weight="bold" fill="#0f766e">数据本地化</text>
  <text x="668" y="518" font-size="12.5" fill="#374151">· 会话与任务历史存 SQLCipher 加密本地库</text>
  <text x="668" y="542" font-size="12.5" fill="#374151">· 本地优先架构，无云端后端</text>

  <!-- ============ Band 3 威胁模型与缓解 ============ -->
  <rect x="30" y="590" width="1220" height="260" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <rect x="30" y="590" width="1220" height="38" rx="12" fill="#ef4444"/>
  <rect x="30" y="615" width="1220" height="13" fill="#ef4444"/>
  <text x="640" y="616" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">威胁模型与缓解（Threat Model &amp; Mitigation）</text>

  <line x1="560" y1="628" x2="560" y2="850" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="310" y="654" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">威胁</text>
  <text x="905" y="654" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">缓解措施</text>

  <line x1="30" y1="672" x2="1250" y2="672" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="310" y="697" font-size="13" fill="#7f1d1d" text-anchor="middle">提示注入 / 恶意指令</text>
  <text x="905" y="697" font-size="13" fill="#374151" text-anchor="middle">生成脚本仅在目标软件内执行，需用户确认</text>

  <line x1="30" y1="722" x2="1250" y2="722" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="310" y="747" font-size="13" fill="#7f1d1d" text-anchor="middle">进程失控 / 资源泄漏</text>
  <text x="905" y="747" font-size="13" fill="#374151" text-anchor="middle">cc_runner 120s 超时强杀；空闲会话 300s 回收</text>

  <line x1="30" y1="772" x2="1250" y2="772" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="310" y="797" font-size="13" fill="#7f1d1d" text-anchor="middle">密钥泄露</text>
  <text x="905" y="797" font-size="13" fill="#374151" text-anchor="middle">密钥明文存储为已知限制 · 建议迁移系统安全存储（Keychain/DPAPI）</text>

  <line x1="30" y1="822" x2="1250" y2="822" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="310" y="847" font-size="13" fill="#7f1d1d" text-anchor="middle">数据外传</text>
  <text x="905" y="847" font-size="13" fill="#374151" text-anchor="middle">任务历史仅存本地 SQLCipher 加密库，无任何云端上传</text>
</svg>
