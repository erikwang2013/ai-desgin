<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrowRev" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1240" height="920" fill="#ffffff"/>

  <!-- Title -->
  <text x="620" y="42" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">AI Design System Architecture</text>
  <text x="620" y="72" font-size="15" fill="#6b7280" text-anchor="middle">Flutter desktop app · Claude Code multi-model orchestration · 62 design-software plugins</text>

  <!-- ============ Left column: AI Engine ============ -->
  <rect x="30" y="110" width="250" height="370" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="155" y="148" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">AI Engine</text>
  <text x="155" y="172" font-size="18" font-weight="bold" fill="#312e81" text-anchor="middle">Claude Code CLI</text>
  <line x1="50" y1="190" x2="260" y2="190" stroke="#c4b5fd" stroke-width="1.5"/>
  <g font-size="14" fill="#111827" text-anchor="middle">
    <rect class="chip" x="50" y="215" width="210" height="40" rx="8"/><text x="155" y="240">Multi-model scheduling</text>
    <rect class="chip" x="50" y="270" width="210" height="40" rx="8"/><text x="155" y="295">Auto script generation</text>
    <rect class="chip" x="50" y="325" width="210" height="40" rx="8"/><text x="155" y="350">Opus · Sonnet · Haiku</text>
  </g>

  <!-- ============ Center column: three layers ============ -->
  <!-- Layer 1 Flutter UI -->
  <rect x="320" y="110" width="600" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="340" y="138" font-size="16" font-weight="bold" fill="#1e3a8a">Flutter UI Layer (Dart)</text>
  <g font-size="14" fill="#111827" text-anchor="middle">
    <rect class="chip" x="340" y="156" width="250" height="38" rx="8"/><text x="465" y="179">ChatView</text>
    <rect class="chip" x="610" y="156" width="250" height="38" rx="8"/><text x="735" y="179">TaskDashboard</text>
    <rect class="chip" x="340" y="206" width="250" height="38" rx="8"/><text x="465" y="229">SoftwarePanel</text>
    <rect class="chip" x="610" y="206" width="250" height="38" rx="8"/><text x="735" y="229">PluginMarketplace</text>
  </g>
  <line x1="620" y1="250" x2="620" y2="318" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="632" y="286" font-size="12.5" fill="#374151">Submit tasks / subscribe status</text>

  <!-- Layer 2 Core -->
  <rect x="320" y="320" width="600" height="160" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="340" y="348" font-size="16" font-weight="bold" fill="#065f46">Core Layer (Dart)</text>
  <g font-size="14" fill="#111827" text-anchor="middle">
    <rect class="chip" x="340" y="365" width="180" height="38" rx="8"/><text x="430" y="388">TaskOrchestrator</text>
    <rect class="chip" x="530" y="365" width="180" height="38" rx="8"/><text x="620" y="388">CCProcessManager</text>
    <rect class="chip" x="720" y="365" width="180" height="38" rx="8"/><text x="810" y="388">ModelRouter</text>
    <rect class="chip" x="340" y="415" width="180" height="38" rx="8"/><text x="430" y="438">PluginManager</text>
    <rect class="chip" x="530" y="415" width="180" height="38" rx="8"/><text x="620" y="438">SessionStore</text>
    <rect class="chip" x="720" y="415" width="180" height="38" rx="8"/><text x="810" y="438">LocaleProvider</text>
  </g>
  <line x1="620" y1="480" x2="620" y2="548" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="632" y="516" font-size="12.5" fill="#374151">Dispatch scripts / report results</text>

  <!-- Layer 3 Plugin -->
  <rect x="320" y="550" width="600" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="340" y="578" font-size="16" font-weight="bold" fill="#92400e">Plugin Layer (BuiltInPlugin ×62)</text>
  <g font-size="13.5" fill="#111827" text-anchor="middle">
    <rect class="chip" x="340" y="598" width="100" height="36" rx="8"/><text x="390" y="620">Figma</text>
    <rect class="chip" x="450" y="598" width="100" height="36" rx="8"/><text x="500" y="620">Blender</text>
    <rect class="chip" x="560" y="598" width="100" height="36" rx="8"/><text x="610" y="620">AutoCAD</text>
    <rect class="chip" x="670" y="598" width="100" height="36" rx="8"/><text x="720" y="620">Photoshop</text>
    <rect class="chip" x="780" y="598" width="125" height="36" rx="8"/><text x="842" y="620">…62 total</text>
  </g>
  <line x1="620" y1="680" x2="620" y2="788" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="632" y="736" font-size="12.5" fill="#374151">Execute scripts / control software</text>

  <!-- ============ Bottom band: Design software ============ -->
  <rect x="320" y="790" width="890" height="100" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="340" y="818" font-size="16" font-weight="bold" fill="#9d174d">Design Software Layer (62 apps · six domains)</text>
  <g font-size="13" fill="#111827" text-anchor="middle">
    <rect class="chip" x="340" y="836" width="100" height="36" rx="8"/><text x="390" y="858">Figma</text>
    <rect class="chip" x="450" y="836" width="100" height="36" rx="8"/><text x="500" y="858">Blender</text>
    <rect class="chip" x="560" y="836" width="100" height="36" rx="8"/><text x="610" y="858">AutoCAD</text>
    <rect class="chip" x="670" y="836" width="100" height="36" rx="8"/><text x="720" y="858">Photoshop</text>
    <rect class="chip" x="780" y="836" width="100" height="36" rx="8"/><text x="830" y="858">Illustrator</text>
    <rect class="chip" x="890" y="836" width="100" height="36" rx="8"/><text x="940" y="858">Maya</text>
    <rect class="chip" x="1000" y="836" width="100" height="36" rx="8"/><text x="1050" y="858">Revit</text>
    <rect class="chip" x="1110" y="836" width="82" height="36" rx="8"/><text x="1151" y="858">…62 apps</text>
  </g>

  <!-- ============ Right column: Storage / Config / Rust ============ -->
  <!-- Core ↔ AI Engine -->
  <line x1="280" y1="400" x2="320" y2="400" stroke="#6b7280" stroke-width="2" marker-start="url(#arrowRev)" marker-end="url(#arrow)"/>
  <text class="halo" x="300" y="386" font-size="12" fill="#374151" text-anchor="middle">Task analysis ↔ Scripts</text>

  <!-- SQLite -->
  <rect x="950" y="320" width="260" height="100" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="1080" y="352" font-size="16" font-weight="bold" fill="#155e75" text-anchor="middle">SQLite Local Storage</text>
  <text x="1080" y="378" font-size="13" fill="#0e7490" text-anchor="middle">Sessions &amp; task history</text>
  <line x1="920" y1="370" x2="950" y2="370" stroke="#6b7280" stroke-width="2" marker-start="url(#arrowRev)" marker-end="url(#arrow)"/>
  <text class="halo" x="935" y="356" font-size="12" fill="#374151" text-anchor="middle">Persistence</text>

  <!-- Config -->
  <rect x="950" y="450" width="260" height="80" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="1080" y="482" font-size="16" font-weight="bold" fill="#854d0e" text-anchor="middle">model-routing.yaml</text>
  <text x="1080" y="506" font-size="13" fill="#a16207" text-anchor="middle">Model routing rules</text>
  <line x1="1080" y1="420" x2="1080" y2="448" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="1092" y="436" font-size="12" fill="#374151">Read routing rules</text>

  <!-- Rust Kernel (FFI integrated) -->
  <rect x="950" y="560" width="260" height="140" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1080" y="588" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">Rust Kernel</text>
  <text x="1080" y="612" font-size="13" fill="#7c3aed" text-anchor="middle">Registry authority · FFI bridge</text>
  <g font-size="12.5" fill="#111827" text-anchor="middle">
    <rect class="chip" x="965" y="630" width="115" height="30" rx="7"/><text x="1022" y="649">62 plugin metadata</text>
    <rect class="chip" x="1090" y="630" width="115" height="30" rx="7"/><text x="1147" y="649">39 plugin crates</text>
    <rect class="chip" x="965" y="668" width="115" height="30" rx="7"/><text x="1022" y="687">flutter_rust_bridge</text>
    <rect class="chip" x="1090" y="668" width="115" height="30" rx="7"/><text x="1147" y="687">IPC isolation</text>
  </g>
  <path d="M 700 480 V 640 H 948" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="halo" x="716" y="630" font-size="12" fill="#374151">Fetch registry via FFI at startup</text>

  <!-- Legend -->
  <g font-size="12.5" fill="#374151">
    <rect x="60" y="850" width="16" height="16" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="84" y="863">UI Layer</text>
    <rect x="160" y="850" width="16" height="16" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="184" y="863">Core Layer</text>
    <rect x="260" y="850" width="16" height="16" rx="4" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="284" y="863">Plugin Layer</text>
    <rect x="360" y="850" width="16" height="16" rx="4" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="384" y="863">AI / Rust Engine</text>
    <rect x="495" y="850" width="16" height="16" rx="4" fill="#ecfeff" stroke="#06b6d4"/>
    <text x="519" y="863">Persistence</text>
    <rect x="595" y="850" width="16" height="16" rx="4" fill="#fdf2f8" stroke="#ec4899"/>
    <text x="619" y="863">Design Software</text>
  </g>
</svg>
