name: Build Release Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 锁定 Flutter 3.44.2（匹配本机 Dart 3.12.2；pubspec sdk 约束 ^3.12.2，
      # 最新 stable 的 Dart 4.x 会使 pub get 解析失败）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build Rust workspace (含 FFI core)
        working-directory: rust
        run: cargo build --release

      - name: Build & package Linux
        if: runner.os == 'Linux'
        run: |
          flutter build linux --release
          # FFI 动态库拷入 bundle，RustLib.init() 从可执行目录 dlopen
          mkdir -p build/linux/x64/release/bundle/lib
          cp rust/target/release/libai_design_core.so build/linux/x64/release/bundle/lib/
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p "release/$VERSION/Ai Desgin"
          cp -R build/linux/x64/release/bundle/* "release/$VERSION/Ai Desgin/"
          cd "release/$VERSION"
          tar -czf "Ai Desgin-$VERSION.tar.gz" "Ai Desgin"
          # .deb：dpkg-deb 零额外依赖；runner 自带 $ORIGIN/lib RUNPATH，库放 lib/ 子目录即可被 dlopen
          mkdir -p packaging/DEBIAN packaging/usr/bin packaging/usr/lib/ai-design-studio
          cp -R "Ai Desgin/." packaging/usr/lib/ai-design-studio/
          ln -s /usr/lib/ai-design-studio/ai_design_studio packaging/usr/bin/ai-design-studio
          printf 'Package: ai-design-studio\nVersion: %s\nSection: graphics\nPriority: optional\nArchitecture: amd64\nMaintainer: erik <erik.xyz>\nDescription: AI-driven design software automation tool\n' "$VERSION" > packaging/DEBIAN/control
          dpkg-deb --build --root-owner-group packaging "Ai Desgin-$VERSION.deb"
          # .tar.xz：xz 压缩
          tar -cJf "Ai Desgin-$VERSION.tar.xz" "Ai Desgin"
          # AppImage：官方 appimagetool（--appimage-extract-and-run 免 FUSE）
          curl -sL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          mkdir -p appimage/AppDir/usr/bin
          cp -R "Ai Desgin/." appimage/AppDir/usr/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexport PATH="$HERE/usr/bin:$PATH"\nexport LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"\nexec ai_design_studio "$@"\n' > appimage/AppDir/AppRun
          chmod +x appimage/AppDir/AppRun
          printf '[Desktop Entry]\nName=AI Design Studio\nExec=ai_design_studio\nIcon=icon\nType=Application\nCategories=Graphics;\n' > appimage/AppDir/ai-design-studio.desktop
          python3 -c "import struct,zlib;c=lambda t,d:(lambda n:struct.pack('>I',len(d))+n+struct.pack('>I',zlib.crc32(n)&0xffffffff))(t+d);ihdr=struct.pack('>IIBBBBB',64,64,8,2,0,0,0);raw=b''.join(b'\x00'+b'\x2e\x7d\x32'*64 for _ in range(64));open('appimage/AppDir/icon.png','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',ihdr)+c(b'IDAT',zlib.compress(raw))+c(b'IEND',b''))"
          /tmp/appimagetool --appimage-extract-and-run appimage/AppDir "Ai Desgin-$VERSION.AppImage"
          # rpm：rpmbuild（apt 装 rpm 包）
          sudo apt-get update
          sudo apt-get install -y rpm
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cat > rpmbuild/SPECS/ai-design-studio.spec <<EOF
          %global debug_package %{nil}
          Name: ai-design-studio
          Version: $VERSION
          Release: 1
          Summary: AI-driven design software automation tool
          License: Proprietary
          BuildArch: x86_64

          %description
          AI-driven design software automation tool.

          %install
          mkdir -p %{buildroot}/usr/lib/ai-design-studio %{buildroot}/usr/bin
          cp -R "$(pwd)/Ai Desgin/." %{buildroot}/usr/lib/ai-design-studio/
          ln -s /usr/lib/ai-design-studio/ai_design_studio %{buildroot}/usr/bin/ai-design-studio

          %files
          /usr/lib/ai-design-studio
          /usr/bin/ai-design-studio
          EOF
          rpmbuild -bb --define "_topdir $(pwd)/rpmbuild" rpmbuild/SPECS/ai-design-studio.spec
          cp rpmbuild/RPMS/x86_64/ai-design-studio-$VERSION-1.x86_64.rpm "Ai Desgin-$VERSION.rpm"

      - name: Build & package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          flutter build windows --release
          # FFI 动态库拷入 runner 目录，RustLib.init() 从可执行目录 dlopen
          cp rust/target/release/ai_design_core.dll build/windows/x64/runner/Release/
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p "release/$VERSION/Ai Desgin"
          cp -R build/windows/x64/runner/Release/* "release/$VERSION/Ai Desgin/"
          cd "release/$VERSION"
          powershell -Command "Compress-Archive -Path 'Ai Desgin' -DestinationPath 'Ai Desgin-$VERSION.zip' -Force"

      # macOS CI 有真机环境：嵌入 dylib + 修 install name + ad-hoc 签名
      # （Flutter 构建已自带 @executable_path/../Frameworks rpath，勿重复添加）
      - name: Build & package macOS
        if: runner.os == 'macOS'
        run: |
          flutter build macos --release
          APP=build/macos/Build/Products/Release/ai_design_studio.app
          mkdir -p "$APP/Contents/Frameworks"
          cp rust/target/release/libai_design_core.dylib "$APP/Contents/Frameworks/"
          install_name_tool -id @rpath/libai_design_core.dylib "$APP/Contents/Frameworks/libai_design_core.dylib"
          codesign --force --deep --sign - "$APP"
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p "release/$VERSION"
          cp -R "$APP" "release/$VERSION/Ai Desgin.app"
          cd "release/$VERSION"
          zip -r "Ai Desgin-$VERSION.zip" "Ai Desgin.app"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-design-studio-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/**/*.tar.gz
            release/**/*.tar.xz
            release/**/*.deb
            release/**/*.rpm
            release/**/*.AppImage
            release/**/*.zip
          if-no-files-found: error
